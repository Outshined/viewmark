<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Viewmark</title>
  <link rel="stylesheet" href="editor.css">
</head>
<body>
  <dialog class="md-login">
    <form>
      <label>Username<input class="md-login-name" name="username" autocomplete="username" placeholder="Username"></label>
      <button type="submit">Continue</button>
    </form>
  </dialog>
  <div class="sheet">
    <nav class="files"><button type="button" class="md-new-file">+</button></nav>
    <div id="editor"></div>
    <aside class="comments"></aside>
  </div>
  <script src="vendor/prism.js"></script>
  <script src="vendor/mermaid.min.js"></script>
  <script type="module" src="src/editor.js"></script>
</body>
</html>
