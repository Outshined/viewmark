<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Background -->
  <rect width="100" height="100" fill="#ffffff"/>
  
  <!-- Rock - asymmetrical organic blob -->
  <path d="M 25 45 
           C 20 55, 15 70, 25 80 
           C 40 90, 60 92, 75 80 
           C 85 70, 88 55, 78 45 
           C 65 35, 40 32, 25 45 Z" 
        fill="#3a3a3a"/>
  
  <!-- Yellow sticky note, slightly tilted, upper-left overlapping rock -->
  <g transform="translate(18, 22) rotate(-8)">
    <rect x="0" y="0" width="32" height="28" rx="2" fill="#FFCC00"/>
    <!-- White line on the note -->
    <rect x="6" y="12" width="18" height="2.5" rx="1" fill="#ffffff"/>
  </g>
</svg>
